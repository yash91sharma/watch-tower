# PR checks (tasks 1.10 and 17.1). Each job runs one part of .devcontainer/ci.sh in the dev
# image (.github/actions/dev-run). Branch protection (17.5) requires all of them.
# Pin all actions by commit SHA. Dependabot updates them.
name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Backend test kinds (unit ... auth), the coverage gates, then the other checks.
        job:
          - static
          - unit
          - property
          - integration
          - migration
          - contract
          - auth
          - coverage
          - frontend
          - docker
          - image
          - dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-run
        with:
          job: ${{ matrix.job }}

  # E2E: the flows, then the accessibility, visual and PWA checks (one Playwright run: the
  # checks need the state that the flows make). arm64, like the screenshot baselines.
  e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-run
        with:
          job: e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

# Release (task 17.1): a v* tag builds the WT image for linux/arm64 on a native ARM runner
# and pushes docker.io/yash91sharma/watch-tower:<version> and :latest. The version is the
# tag without "v". Then it publishes a GitHub release for the tag. Set the repo secret
# DOCKERHUB_TOKEN (a Docker Hub access token with read and write access) before the first tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: yash91sharma
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            docker.io/yash91sharma/watch-tower:${{ steps.version.outputs.version }}
            docker.io/yash91sharma/watch-tower:latest
          push: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  # After the image push, publish a GitHub release for the tag. The title is the tag, and
  # GitHub makes the notes. Only this job can write to the repo.
  github-release:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

# Build the dev image (cached in GitHub Actions) and run one CI job in it:
# .devcontainer/ci.sh <job>. The container gets the host Docker socket, like wt_dev.
name: Run a job in the dev image
description: Build the dev image and run .devcontainer/ci.sh with a job name.

inputs:
  job:
    description: The ci.sh job, for example static or unit.
    required: true

runs:
  using: composite
  steps:
    - id: user
      shell: bash
      run: echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # The dev user gets the runner UID, so that it can write to the checkout.
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .devcontainer
        build-args: USER_UID=${{ steps.user.outputs.uid }}
        tags: wt_dev
        load: true
        cache-from: type=gha,scope=dev-${{ runner.arch }}
        cache-to: type=gha,mode=max,scope=dev-${{ runner.arch }}

    # uv and pnpm caches. The key changes with the lock files.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/wt
        key: deps-${{ runner.arch }}-${{ hashFiles('backend/uv.lock', 'frontend/pnpm-lock.yaml') }}
        restore-keys: deps-${{ runner.arch }}-

    - shell: bash
      env:
        JOB: ${{ inputs.job }}
      run: |
        mkdir -p ~/.cache/wt/uv ~/.cache/wt/pnpm
        docker run --rm --name wt_dev --label wt.enable=false \
          --add-host=host.docker.internal:host-gateway \
          --group-add "$(stat -c %g /var/run/docker.sock)" \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$PWD:/workspace" -w /workspace \
          -v "$HOME/.cache/wt/uv:/home/dev/.cache/uv" \
          -v "$HOME/.cache/wt/pnpm:/home/dev/.local/share/pnpm" \
          -e UV_LINK_MODE=copy -e UV_COMPILE_BYTECODE=1 -e UV_PYTHON_DOWNLOADS=never \
          -e PNPM_HOME=/home/dev/.local/share/pnpm \
          -e TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal \
          -e TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock \
          -e JOB -e FOOTPRINT -e WT_SCHEMATHESIS_EXAMPLES \
          wt_dev bash -c '
            set -euo pipefail
            (cd backend && uv sync --locked)
            (cd frontend && pnpm install --frozen-lockfile)
            bash .devcontainer/ci.sh "$JOB"
          '

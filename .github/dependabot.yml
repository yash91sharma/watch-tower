# Dependabot (task 17.4): weekly update PRs. Minor and patch updates come in one PR per
# ecosystem; a major update gets its own PR. The PR checks (17.1) test each PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python: { update-types: [minor, patch] }

  # pnpm lock files. e2e/ has the Playwright packages.
  - package-ecosystem: npm
    directories: [/frontend, /e2e]
    schedule: { interval: weekly }
    groups:
      npm: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { update-types: [minor, patch] }

  # Base images: the WT image (Dockerfile) and the dev image.
  - package-ecosystem: docker
    directories: [/, /.devcontainer]
    schedule: { interval: weekly }

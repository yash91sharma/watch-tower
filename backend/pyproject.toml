[project]
name = "wt"
version = "0.0.0"
description = "Watch Tower backend"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-xdist",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run tests in parallel on all CPUs. Use "-n0" to run one test fast.
addopts = "-n auto"

[tool.ruff]
target-version = "py314"

[tool.pyright]
typeCheckingMode = "strict"

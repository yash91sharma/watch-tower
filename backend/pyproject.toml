[project]
name = "wt"
version = "0.0.0"
description = "Watch Tower backend"
requires-python = ">=3.14"
dependencies = [
    "aiodocker>=0.27.0",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
wt = "wt.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mutmut>=3.8.1",
    "pip-audit>=2.10.1",
    "pyright",
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-xdist",
    "respx>=0.23.1",
    "ruff",
    "schemathesis>=4.33.0",
    "testcontainers>=4.15.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
# The package is at backend/wt/, not at backend/src/wt/.
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run tests in parallel on all CPUs. Use "-n0" to run one test fast.
# The default run skips slow tests. CI runs them with "-m docker" (or e2e, llm_eval).
addopts = "-n auto --strict-markers -m 'not docker and not e2e and not llm_eval'"
markers = [
    "docker: needs the host Docker (testcontainers)",
    "e2e: needs the full E2E stack",
    "llm_eval: calls a real LLM server",
]

[tool.coverage.run]
source = ["wt"]
branch = true

[tool.coverage.report]
# One total for lines and branches together (coverage.py has no separate gates).
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Default rules, plus security (S) and banned APIs (TID251).
extend-select = ["S", "TID251"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and run local commands.
"tests/**" = ["S101", "S603"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Tasks 2.1 and 6.2 add the banned APIs here.

[tool.pyright]
include = ["wt", "tests"]
strict = ["wt", "tests"]
typeCheckingMode = "strict"

[tool.mutmut]
paths_to_mutate = ["wt/"]
# mutmut does not work with xdist.
pytest_add_cli_args = ["-n0"]

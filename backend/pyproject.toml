[project]
name = "wt"
version = "0.0.0"
description = "Watch Tower backend"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
wt = "wt.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-xdist",
    "ruff",
]

[tool.uv]
package = true

[tool.uv.build-backend]
# The package is at backend/wt/, not at backend/src/wt/.
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run tests in parallel on all CPUs. Use "-n0" to run one test fast.
addopts = "-n auto"

[tool.ruff]
target-version = "py314"

[tool.pyright]
typeCheckingMode = "strict"

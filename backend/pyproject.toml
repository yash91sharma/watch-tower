[project]
name = "wt"
version = "0.0.0"
description = "Watch Tower backend"
requires-python = ">=3.14"
dependencies = [
    "aiodocker>=0.27.0",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
wt = "wt.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-xdist",
    "ruff",
]

[tool.uv]
package = true

[tool.uv.build-backend]
# The package is at backend/wt/, not at backend/src/wt/.
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run tests in parallel on all CPUs. Use "-n0" to run one test fast.
addopts = "-n auto"

[tool.ruff]
target-version = "py314"

[tool.pyright]
typeCheckingMode = "strict"

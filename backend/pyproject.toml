[project]
name = "wt"
version = "0.4.0"
description = "Watch Tower backend"
requires-python = ">=3.15"
dependencies = [
    "aiodocker>=0.27.0",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
wt = "wt.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mutmut>=3.8.1",
    "pip-audit>=2.10.1",
    "pyright",
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-xdist",
    "respx>=0.23.1",
    "ruff",
    "schemathesis>=4.33.1",
    "testcontainers>=4.15.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
# The package is at backend/wt/, not at backend/src/wt/.
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests can import helper modules, for example tests.docker.env, and the E2E fakes (fakes.github).
pythonpath = [".", "../e2e"]
# Run tests in parallel on all CPUs. Use "-n0" to run one test fast.
# The default run skips slow tests. CI runs them with "-m docker" (or e2e, llm_eval).
addopts = "-n auto --import-mode=importlib --strict-markers -m 'not docker and not e2e and not llm_eval'"
markers = [
    "docker: needs the host Docker (testcontainers)",
    "e2e: needs the full E2E stack",
    "llm_eval: calls a real LLM server",
]
# A warning (for example an unclosed DB connection) fails the test.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["wt"]
branch = true

[tool.coverage.report]
# One total for lines and branches together (coverage.py has no separate gates).
fail_under = 97
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
# Default rules, plus security (S) and banned APIs (TID251).
extend-select = ["S", "TID251"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, fake secrets and local commands.
"tests/**" = ["S101", "S105", "S106", "S603"]
# The only module that reads the real time.
"wt/clock.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use wt.clock.now()."
"datetime.datetime.utcnow".msg = "Use wt.clock.now()."
"time.time".msg = "Use wt.clock.now()."
"asyncio.sleep".msg = "Use wt.clock.sleep()."
"aiodocker".msg = "Only wt/docker/client.py uses aiodocker. Use wt.docker."

[tool.pyright]
include = ["wt", "tests", "../e2e/fakes"]
strict = ["wt", "tests", "../e2e/fakes"]
extraPaths = ["../e2e"]
typeCheckingMode = "strict"

[tool.mutmut]
source_paths = ["wt/versions/", "wt/health/", "wt/notify/"]
# The tests import the rest of wt too.
also_copy = ["wt/", "alembic.ini"]
# The tests of the mutated modules, and the API tests that use them.
tests_dir = [
    "tests/unit/versions/",
    "tests/unit/health/",
    "tests/unit/notify/",
    "tests/integration/",
]
# mutmut does not work with xdist.
pytest_add_cli_args = ["-n0"]
